name: Build GitHub Pages files

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy build to Pages root
        run: |
          rm -rf assets
          cp -r dist/assets assets
          cp dist/index.html index.html
          cp dist/favicon.svg dist/nft.png dist/certificaciones.html dist/contacto.html dist/notebook.html dist/proyectos.html dist/section.css dist/writeups.html .

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets favicon.svg nft.png certificaciones.html contacto.html notebook.html proyectos.html section.css writeups.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Actualiza build de GitHub Pages"
            git push
          fi
