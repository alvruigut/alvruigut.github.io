<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-monkey.png?v=20260601" />
    <title>TTY | Notebook</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/section.css" />
  </head>
  <body>
    <main class="section-shell notebook-shell">
      <a class="back-link" href="/notebook.html">~/notebook</a>

      <section class="notebook-workspace" aria-label="Notebook">
        <aside class="notebook-sidebar" aria-label="Explorador de apuntes" data-notebook-index></aside>

        <article class="note-panel is-active" id="tty">
          <div class="note-tabbar">
            <span>TTY</span>
            <details class="notebook-tag-search">
              <summary>Buscar tags</summary>
              <label>
                <span>Tags de apuntes</span>
                <input class="notebook-search-input" type="search" placeholder="Busca por herramienta, técnica o tag del apunte" autocomplete="off" />
              </label>
              <div class="notebook-search-results" aria-live="polite"></div>
            </details>
            <span>~/notebook/Shells</span>
          </div>

          <div class="note-content">
            <p class="eyebrow">shells</p>
            <h2>TTY</h2>

            <section class="code-card">
              <h3>Tratamiento de la tty</h3>
              <pre><code>script /dev/null -c bash
# CTRL+Z
stty raw -echo; fg
reset xterm
export TERM=xterm
export SHELL=bash

# REDIMENSIONAR
# Kali
stty -a 
# Shell target
stty rows 24 columns 80</code></pre>
            </section>
            <h2>Tags</h2>
            <div class="tag-list">
              <span>tty</span>
              <span>shells</span>
            </div>
          </div>
        </article>
      </section>
    </main>
    <script src="/notebook/index.js"></script>
    <script src="/notebook/folder-state.js"></script>
    <script src="/notebook/search.js"></script>
  </body>
</html>
