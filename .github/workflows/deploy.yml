name: Build GitHub Pages files

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy build to Pages root
        run: |
          rm -rf assets cert-assets certificaciones notebook notebook-assets project-assets writeups
          rm -f 404.html favicon-monkey.png nft.png section.css certificaciones.html notebook.html proyectos.html writeups.html
          cp -r dist/. .

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Actualiza build de GitHub Pages"
            git push
          fi
